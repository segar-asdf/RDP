name: RDP-macOS

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Create Local User with Simple Password
        run: |
          USERNAME="segar"
          PASSWORD="2503"

          # Create user if not exists
          if ! id "$USERNAME" &>/dev/null; then
            sudo sysadminctl -addUser "$USERNAME" -password "$PASSWORD"
            sudo dscl . -append /Groups/admin GroupMembership "$USERNAME"
          fi

          echo "RDP_CREDS=User: $USERNAME | Password: $PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          TS_URL="https://pkgs.tailscale.com/stable/Tailscale-latest-macos.pkg"
          PKG_PATH="$RUNNER_TEMP/tailscale.pkg"

          curl -L "$TS_URL" -o "$PKG_PATH"
          sudo installer -pkg "$PKG_PATH" -target /
          rm "$PKG_PATH"

      - name: Install Homebrew Packages (xrdp + deps)
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew update
          brew install xrdp

      - name: Start XRDP Service
        run: |
          sudo brew services start xrdp
          sleep 5
          if ! pgrep -x "xrdp" > /dev/null; then
            echo "XRDP failed to start"
            exit 1
          fi
          echo "XRDP is running"

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$GITHUB_RUN_ID
          
          # Wait for IP assignment
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
            TS_IP=$(tailscale ip -4 | head -n1)
            sleep 5
            RETRIES=$((RETRIES+1))
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned. Exiting."
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Show Access Info
        run: |
          echo "=== ACCESS INFO ==="
          echo "RDP Address: $TAILSCALE_IP:3389"
          echo "Username: segar"
          echo "Password: 2503"
          echo "==================="

      - name: Keep Alive
        run: |
          while true; do
            echo "[$(date)] macOS RDP session active - cancel workflow to stop"
            sleep 300
          done
