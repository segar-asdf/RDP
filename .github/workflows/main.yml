name: VNC-macOS

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Enable VNC Screen Sharing
        run: |
          # Enable Remote Management (VNC)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -restart -agent -privs -all

          # Enable VNC legacy mode
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes

          # Set VNC password (2503)
          echo "2503" | sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvncpw

      - name: Install Tailscale
        run: |
          TS_URL="https://pkgs.tailscale.com/stable/Tailscale-latest-macos.pkg"
          curl -fsSL "$TS_URL" -o tailscale.pkg
          sudo installer -pkg tailscale.pkg -target /
          rm tailscale.pkg

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$GITHUB_RUN_ID

          # Wait until Tailscale IP is assigned
          TS_IP=""
          for i in {1..10}; do
            TS_IP=$(tailscale ip -4 | head -n 1)
            if [ ! -z "$TS_IP" ]; then break; fi
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale failed to assign IP"
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify VNC Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          nc -zv $TAILSCALE_IP 5900 || (echo "VNC port 5900 not open" && exit 1)
          echo "VNC port is accessible!"

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== VNC ACCESS DETAILS ==="
          echo "Address: $TAILSCALE_IP:5900"
          echo "Password: 2503"
          echo "==========================="
          echo ""
          while true; do
            echo "[$(date)] VNC Active - Cancel workflow to terminate"
            sleep 300
          done
