name: macOS VNC with Tailscale

on:
  workflow_dispatch:

jobs:
  vnc-rdp:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Management (VNC)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -restart -agent -privs -all -users runner
          echo "VNC enabled for user 'runner' with all privileges."

      - name: Install Tailscale via Homebrew
        run: |
          brew install --cask tailscale
          sudo tailscaled --tun=userspace-networking --socks5-server=localhost:1055 &
          sleep 5

      - name: Connect to Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-runner-$GITHUB_RUN_ID \
            --accept-routes --accept-dns=true

          # Wait for Tailscale IP
          TS_IP=""
          for i in {1..10}; do
            TS_IP=$(tailscale ip -4 | head -n 1)
            if [ ! -z "$TS_IP" ]; then break; fi
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale failed to assign IP"
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify VNC Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          nc -zv $TAILSCALE_IP 5900 || (echo "VNC port not reachable" && exit 1)
          echo "VNC port 5900 is accessible."

      - name: Show Connection Info
        run: |
          echo ""
          echo "=== VNC ACCESS ==="
          echo "Address (via Tailscale): $TAILSCALE_IP"
          echo "Username: runner"
          echo "Password: (set your VNC password manually in macOS settings if needed)"
          echo "=================="
          echo ""

      - name: Keep Runner Alive
        run: |
          while true; do
            echo "[$(date)] macOS VNC session active..."
            sleep 300
          done
