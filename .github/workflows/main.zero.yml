
name: RDP-ZeroTier

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-ZeroTier"

          # Restrict the RDP rule to the ZeroTier interface.
          # Verify the interface alias after ZeroTier is installed.
          Restart-Service -Name TermService -Force

      - name: Disable Password Complexity Requirement
        shell: pwsh
        run: |
          secedit /export /cfg "$env:TEMP\secpol.cfg"

          (Get-Content "$env:TEMP\secpol.cfg").Replace(
            "PasswordComplexity = 1",
            "PasswordComplexity = 0"
          ) | Set-Content "$env:TEMP\secpol.cfg"

          secedit /configure /db "$env:TEMP\secedit.sdb" `
            /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY

          gpupdate /force

      - name: Create RDP User
        shell: pwsh
        run: |
          # Preserving your original password method.
          $password = "2503"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "SEGAR" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "SEGAR" `
              -Password $securePass `
              -AccountNeverExpires
          } else {
            Set-LocalUser -Name "SEGAR" -Password $securePass
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "SEGAR" -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "SEGAR" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "SEGAR")) {
            throw "User creation failed."
          }

          Write-Host "RDP user SEGAR created."

      - name: Install ZeroTier
        shell: pwsh
        run: |
          $installer = "$env:TEMP\ZeroTierOne.msi"
          $url = "https://download.zerotier.com/dist/ZeroTier%20One.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/qn", "/norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "ZeroTier installation failed: $($process.ExitCode)"
          }

          $service = Get-Service -Name ZeroTierOneService `
            -ErrorAction SilentlyContinue

          if (-not $service) {
            throw "ZeroTier service not found."
          }

          Start-Service ZeroTierOneService

          $cli = "$env:ProgramFiles (x86)\ZeroTier\One\zerotier-cli.bat"

          if (-not (Test-Path $cli)) {
            $cli = "$env:ProgramFiles\ZeroTier\One\zerotier-cli.bat"
          }

          if (-not (Test-Path $cli)) {
            throw "ZeroTier CLI not found."
          }

          "ZTCLI=$cli" >> $env:GITHUB_ENV

      - name: Join ZeroTier Network
        shell: pwsh
        env:
          ZEROTIER_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
        run: |
          if ($env:ZEROTIER_NETWORK_ID -notmatch '^[a-fA-F0-9]{16}$') {
            throw "Add your 16-character ZEROTIER_NETWORK_ID secret."
          }

          & $env:ZTCLI join $env:ZEROTIER_NETWORK_ID

          if ($LASTEXITCODE -ne 0) {
            throw "Could not join ZeroTier network."
          }

          $ztIP = $null

          for ($i = 0; $i -lt 36; $i++) {
            Start-Sleep -Seconds 5

            $output = & $env:ZTCLI listnetworks 2>&1

            $network = $output |
              Where-Object { $_ -match [regex]::Escape($env:ZEROTIER_NETWORK_ID) } |
              Select-Object -First 1

            if ($network -match '\bACCESS_DENIED\b') {
              Write-Host "Authorize this device in ZeroTier Central."
            }

            if ($network -match '\bOK\b') {
              $ipv4 = [regex]::Matches(
                "$network",
                '(?<![\w.])(?:\d{1,3}\.){3}\d{1,3}(?:/\d+)?'
              )

              foreach ($match in $ipv4) {
                $candidate = ($match.Value -split '/')[0]

                if ($candidate -notlike '127.*') {
                  $ztIP = $candidate
                  break
                }
              }
            }

            if ($ztIP) { break }
          }

          if (-not $ztIP) {
            & $env:ZTCLI listnetworks
            throw "No ZeroTier IP obtained. Authorize the runner and try again."
          }

          "ZT_IP=$ztIP" >> $env:GITHUB_ENV
          Write-Host "ZeroTier IP: $ztIP"

      - name: Configure ZeroTier RDP Firewall
        shell: pwsh
        run: |
          $ztAdapter = Get-NetAdapter |
            Where-Object {
              $_.Name -match 'ZeroTier' -or
              $_.InterfaceDescription -match 'ZeroTier'
            } |
            Select-Object -First 1

          if (-not $ztAdapter) {
            throw "ZeroTier network adapter not found."
          }

          New-NetFirewallRule `
            -DisplayName "RDP-ZeroTier" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -InterfaceAlias $ztAdapter.Name `
            -Profile Any

          $ready = $false

          for ($i = 0; $i -lt 12; $i++) {
            if ((Test-NetConnection 127.0.0.1 -Port 3389 `
                -WarningAction SilentlyContinue).TcpTestSucceeded) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw "RDP is not listening on port 3389."
          }

          Write-Host "RDP listener ready."
          Write-Host "ZeroTier IP: $env:ZT_IP"
          Write-Host "Username: SEGAR"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address: $env:ZT_IP"
          Write-Host "Username: SEGAR"
          Write-Host "Password: 2503"
          Write-Host "=================="

          while ($true) {
            Write-Host "[$(Get-Date)] Runner active"
            Start-Sleep -Seconds 300
          }
